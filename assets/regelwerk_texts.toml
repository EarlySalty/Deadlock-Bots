# Regelwerk V2 Texte fuer /serversync/regelwerk-apply.
# Fehlende Felder fallen auf Compile-Defaults zurueck.

[texts]
title = "**📜 Regelwerk · Deutsche Deadlock Community**"
body = """Die Kurzfassung: **Sei kein Arschloch** 😄 — Respekt gegenüber allen, keine Hassrede, kein Spam, keine Fremdwerbung.

Für die Details tipp unten auf einen Button — die Antwort siehst nur du."""
verhalten = """**🤝 Verhalten**
- Respekt gegenüber allen — keine Beleidigungen, Diskriminierung oder persönlichen Angriffe
- Keine Hassrede. Kein NSFW außerhalb der dafür markierten Kanäle. Kein Spam, keine Fremdwerbung
- Privatsphäre respektieren — keine fremden Daten posten
- Schädliche Inhalte (Viren, IP-Grabber, Scam-Links) = sofortiger permanenter Bann"""
spielkontext = """**🎮 Im Spielkontext erlaubt**
Situatives Trash-Talking, Sarkasmus, Wortspiele sind okay — solange es nicht persönlich wird. Ohne Mimik und Tonfall kommt Geschriebenes schnell falsch an: check vorher ab, ob alle damit fein sind. Und wenn jemand sagt „lass gut sein" — dann ist gut."""
moderation = """**🛡️ Moderation & Konsequenzen**
Probleme oder Streit? Ping @Moderator oder @Owner — oder mach ein Ticket in <#1459628609705738539> auf, wenn's diskreter sein soll.
Konsequenzen je nach Schwere: Verwarnung → Timeout → Ban. Schädliche Inhalte führen direkt zum permanenten Bann."""
wegweiser = """**🧭 Schnell zurechtfinden**
- <#1398021105339334666> — Steam verknüpfen, Rang eintragen
- <#1459628609705738539> — wenn irgendwas nicht funktioniert (Ticket aufmachen)
- <#1491953161747955853> — Fragen über Server, Bots und Concierge
- <#1426220702054355077> — Community-Fragen und Deadlock-Invite
- <#1522769149208821881> — Mitspieler finden"""
datenschutz = """**🔒 Datenschutz & KI-Moderation**

**Moderation & KI**
Nachrichten in moderierten Kanälen werden automatisch auf Regelverstöße geprüft. Dazu wird der Nachrichtentext an externe KI-Dienstleister (u. a. Fireworks AI) übermittelt. Diese verarbeiten die Inhalte nur zur Analyse in unserem Auftrag und trainieren damit keine KI-Modelle.

**Speicherung**
Normale Nachrichten werden nicht gespeichert, nur im Moment geprüft. Nur bei einem Verstoß speichern wir einen Moderationsfall (Inhalt, User-ID, Zeitpunkt, Ergebnis). Der Nachrichteninhalt wird nach 90 Tagen automatisch gelöscht.

**Rechte, Discord-ToS & Kontakt**
Auskunft, Löschung und Opt-out jederzeit über /datenschutz oder einen Moderator/Owner. Zusätzlich gelten die Discord-Nutzungsbedingungen (https://discord.com/terms) und Community-Richtlinien (https://discord.com/guidelines). Fragen: <#1459628609705738539> oder an einen Moderator/Owner."""

[buttons]
verhalten = "🤝 Verhalten"
spielkontext = "🎮 Ton & Trash-Talk"
moderation = "🛡️ Moderation"
wegweiser = "🧭 Wichtige Kanäle"
datenschutz = "🔒 Datenschutz"
