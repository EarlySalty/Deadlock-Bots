# Support-Panel fuer /serversync/support-apply.
# Die Stripe-Schaltflaeche erscheint erst, wenn [urls].stripe gesetzt ist.
# Vorher keine Checkout-URL erfinden oder auf ein anderes Produkt umleiten.

[texts]
title = "**💜 Server unterstützen**"
boost = """**So kannst du den Server unterstützen**
• **Discord-Server-Abo** oder **Server-Boost** (Boosts zählen vorerst ebenfalls)
• **Ko-fi-Spende** – die Unterstützer-Rolle gibt es dafür für 31 Tage, nach manueller Freischaltung
• **Kostenpflichtiges Twitch-Bot-Abo** – die Discord-Supporter-Vorteile gibt es zusätzlich dazu, sobald die automatische Zuordnung eingerichtet ist

Ein eigenes Stripe-Abo für Discord ist in Vorbereitung."""
donation = """**Warum brauche ich Unterstützung?**
Server, APIs, KI-Abos und die Entwicklung kosten je nach Monat **50 bis 250 €**, manchmal deutlich mehr. Allein 2026 sind nach meinen bisherigen Abrechnungen schon **über 1.600 €** zusammengekommen – ohne meine Arbeitszeit.

Und ja, auch die KI-Abos kosten Geld. Bei so vielen Entwicklungsstunden sind sie aber deutlich günstiger, als die gleiche Zeit selbst nur zum Mindestlohn bei einem Entwickler bezahlen zu müssen. Planen, testen, Fehler beheben und alles betreiben muss ich trotzdem selbst.

Das Geld fließt zurück in Infrastruktur und Entwicklung, nicht in meinen Gewinn."""
benefits = """**Was bekommen Server-Supporter?**
• **Steam Bot:** Die komplette Nutzung mit Steam-Verknüpfung, Rang-Rollen und Match-Abfragen wird auf Supporter umgestellt.
• **Deadlock Brain:** Zugang ohne zusätzliche Kosten und ohne Nutzungslimits.
• **Discord:** private Supporter-Channels, Streamer-VC und zusätzliche Voice-Rechte in freigegebenen Bereichen.
• **Mitgestalten:** Abstimmungen, Einblicke in die Entwicklung und früher Zugang zu Betatests.

**Was noch kommen soll**
• **Brain-Build-Helfer:** Item- und Build-Vorschläge mit Erklärungen und Anpassungen an Gegner und Patches.
• **Patch-Watchlist:** Benachrichtigungen zu Änderungen an euren Lieblingsheroes und Items.
• Weitere Steam-Bot-Funktionen, sofern die Daten zuverlässig verfügbar sind.

**Weiterhin kostenlos:** Mitspieler suchen, Voice-Channels, reguläre Turniere und Scrims sowie das normale Coaching.

Danke an alle, die dabei helfen, den Server und die Projekte am Laufen zu halten. 💜"""

[buttons]
donate = "☕ Über Ko-fi unterstützen"
stripe = "💳 Stripe-Abo abschließen"

[urls]
donate = "https://ko-fi.com/deutschedeadlockcommunity"
