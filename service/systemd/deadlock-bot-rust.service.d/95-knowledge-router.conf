[Service]
# Existing LoadCredential=infisical-token supplies the bootstrap credential.
# %d is expanded by systemd; no environment variable or secret command argument.
ExecStart=
ExecStart=/bin/bash -c 'if test -r "%d/infisical-token"; then exec 9<"%d/infisical-token" || true; fi; exec /home/naniadm/Documents/Deadlock-Bots/scripts/run_dl_bot_service.sh'
