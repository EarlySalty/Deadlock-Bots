name: "Maximum Security & Quality Analysis"

# Alle Query-Suites
queries:
  - uses: security-extended
  - uses: security-and-quality

# Query-Packs für alle Sprachen
packs:
  javascript-typescript:
    - codeql/javascript-queries
  go:
    - codeql/go-queries
  java-kotlin:
    - codeql/java-queries
  csharp:
    - codeql/csharp-queries
  ruby:
    - codeql/ruby-queries
  rust:
    - codeql/rust-queries
  c-cpp:
    - codeql/cpp-queries
  swift:
    - codeql/swift-queries

# Generated bundle output of vendored third-party GitHub action.
# Scan the action sources, not compiled output noise.
paths-ignore: []
