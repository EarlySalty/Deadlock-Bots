name: dl-knowledge hybrid CI

on:
  push:
    branches:
      - feat/dl-knowledge-hybrid
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Knowledge hybrid
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
      - name: Format Hybrid Dateien
        run: |
          rustfmt --edition 2021 --check \
            bin/dl-knowledge/src/main.rs \
            bin/dl-knowledge/src/hybrid/mod.rs \
            bin/dl-knowledge/src/hybrid/pipeline.rs \
            bin/dl-knowledge/src/hybrid/quality.rs \
            bin/dl-knowledge/src/hybrid/bench.rs \
            bin/dl-knowledge/src/hybrid/cli.rs \
            bin/dl-knowledge/src/hybrid/tests.rs \
            bin/dl-knowledge/src/hybrid/tests_http.rs
      - name: Test dl-knowledge
        run: bash scripts/central_test_db.sh cargo test --package dl-knowledge --all-features -- --test-threads=2
      - name: Clippy dl-knowledge
        run: cargo clippy --package dl-knowledge --all-features --no-deps -- -D warnings
      - name: Test Messbericht Merger
        run: python3 ../.tasks/2026-09-17-rag-ausbau-visual-brain/test_auswertung_c.py
