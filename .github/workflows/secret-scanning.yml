name: Secret Scanning

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks blocking scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: bash .github/ci/install-tools.sh gitleaks
      - name: Block tracked secret material filenames
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|machine_auth_token\.txt|refresh\.token)$' || true)
          if [ -n "$forbidden" ]; then
            printf '::error::Tracked secret material files: %s\n' "$forbidden"
            exit 1
          fi
      - name: Prove secret findings and scanner errors block
        run: |
          export PATH="$PWD/.ci/bin:$PATH"
          bash .github/ci/scanner-counterchecks.sh gitleaks
      - name: Scan complete working tree
        run: .ci/bin/gitleaks dir --redact --exit-code 1 --config .gitleaks.toml .
      - name: Scan PR commits or complete history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
            .ci/bin/gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="$PR_BASE..$PR_HEAD" .
          else
            .ci/bin/gitleaks git --redact --exit-code 1 --config .gitleaks.toml .
          fi

  trivy-secrets:
    name: Trivy blocking secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Trivy
        run: bash .github/ci/install-tools.sh trivy
      - name: Scan complete working tree
        run: >-
          .ci/bin/trivy fs --scanners secret --exit-code 1
          --skip-dirs .ci --skip-dirs .git --skip-dirs rust/target .
