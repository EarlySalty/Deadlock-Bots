name: Discord config and workspace CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feat/discord-global-toml-20260920, feat/discord-toml-rollout-20260920]

permissions:
  contents: read

jobs:
  config:
    name: Rust workspace and existing config contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and native test dependencies
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev libopus-dev protobuf-compiler postgresql-client ffmpeg
      - name: Compile all workspace targets with checked-in SQLx cache
        working-directory: rust
        run: cargo +1.88.0 build --locked --workspace --all-targets --all-features -j 2
      - name: Clippy denies warnings across all workspace targets
        working-directory: rust
        run: cargo +1.88.0 clippy --locked --workspace --all-targets --all-features -j 2 -- -D warnings
      - name: Check existing runtime consumers
        working-directory: rust
        run: cargo +1.88.0 check --locked -j 2 -p dl-bot -p dl-web
      - name: Check dashboard script
        run: node --check service/static/operating-config.js
      - name: Validate repository TOML
        run: cargo +1.88.0 run --locked -j 2 --manifest-path rust/Cargo.toml -p dl-core --bin dl-config-check -- --config config/bot.toml
      - name: Test config, workspace, DB and hybrid contracts in a disposable database
        run: bash rust/scripts/central_test_db.sh bash ../.github/ci/rust-tests.sh
