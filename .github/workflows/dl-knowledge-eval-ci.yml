name: dl-knowledge eval CI

# Hermetic eval/parser/unit tests run in the required workspace suite.
# The old mutable private Deadlock-Docs/main checkout is not a PR prerequisite.
# External corpus/live API acceptance is documented separately in SECURITY-CI.md.
on:
  workflow_dispatch:
  push:
    branches: [feat/dl-knowledge-eval]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/discord-config-ci.yml # zizmor: ignore[self-repository] -- Same-commit workflow; actionlint 1.7.12 does not parse dollar-slash syntax.
