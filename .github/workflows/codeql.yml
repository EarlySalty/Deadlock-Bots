name: CodeQL Advanced

on:
  workflow_call:
  schedule:
    - cron: '44 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect tracked languages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and test actual-language detection
        run: |
          mkdir -p .ci
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --edition=2021 -D warnings --test .github/ci/codeql_languages.rs -o .ci/codeql-language-tests
          .ci/codeql-language-tests
          rustc +1.88.0 --edition=2021 -D warnings .github/ci/codeql_languages.rs -o .ci/codeql-languages
      - name: Detect actual Python, Rust, JavaScript and Actions
        id: detect
        run: .ci/codeql-languages >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      SQLX_OFFLINE: 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust extractor prerequisites
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          SQLX_OFFLINE: 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform analysis without requiring reporting permissions
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Block findings, scanner errors and missing SARIF
        run: bash .github/ci/check-sarif.sh "$RUNNER_TEMP/codeql-results"
      - name: Archive reports independently of scanner enforcement
        if: ${{ always() }}
        continue-on-error: true # Only reporting. Analysis and SARIF gate above remain blocking.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7

  complete:
    name: CodeQL complete
    if: ${{ always() }}
    needs: [detect, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on detection or matrix failure
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$DETECT_RESULT" = success && test "$ANALYZE_RESULT" = success
