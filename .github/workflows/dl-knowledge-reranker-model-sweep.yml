name: dl-knowledge reranker model sweep

on:
  push:
    branches:
      - feat/dl-knowledge-hybrid
    paths:
      - .github/workflows/dl-knowledge-reranker-model-sweep.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dl-knowledge-reranker-model-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Checkout aktueller Golden Stand
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: EarlySalty/Deadlock-Docs
          ref: main
          path: Deadlock-Docs
      - name: Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Lokale Modelle bereitstellen
        run: |
          set -euo pipefail
          embed_dir="$RUNNER_TEMP/all-MiniLM-L6-v2"
          embed_revision=1110a243fdf4706b3f48f1d95db1a4f5529b4d41
          embed_base="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/$embed_revision"
          mkdir -p "$embed_dir"
          for file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json; do
            curl --proto '=https' --tlsv1.2 --fail --location "$embed_base/$file" --output "$embed_dir/$file"
          done
          curl --proto '=https' --tlsv1.2 --fail --location "$embed_base/onnx/model.onnx" --output "$embed_dir/model.onnx"

          rerank_dir="$RUNNER_TEMP/ms-marco-TinyBERT-L2-v2"
          rerank_revision=06bb80f1d80e735f3d66ad9c538b3efd59eb182e
          rerank_base="https://huggingface.co/cross-encoder/ms-marco-TinyBERT-L2-v2/resolve/$rerank_revision"
          mkdir -p "$rerank_dir"
          for file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json; do
            curl --proto '=https' --tlsv1.2 --fail --location "$rerank_base/$file" --output "$rerank_dir/$file"
          done
          curl --proto '=https' --tlsv1.2 --fail --location "$rerank_base/onnx/model.onnx" --output "$rerank_dir/model.onnx"
          printf '%s  %s\n'             '0eac39ee56a3edf98d0beee17fa1bb368a5a1d8c8671b5afd6dd71677f8d8496' model.onnx             | (cd "$rerank_dir" && sha256sum --check -)

          echo "DL_KNOWLEDGE_MODELS=$embed_dir" >> "$GITHUB_ENV"
          echo "DL_KNOWLEDGE_RERANK_MODELS=$rerank_dir" >> "$GITHUB_ENV"
      - name: Release Binary bauen
        run: cargo build --release --package dl-knowledge --jobs 2
      - name: TinyBERT Schnittstelle prüfen
        env:
          DL_KNOWLEDGE_EMBEDDER: fastembed
          DL_KNOWLEDGE_HYBRID_OPTIONS: '{"rerank":true,"rerank_batch_size":8,"timeout_ms":10000}'
        run: |
          printf '%s\n' '{"question":"Wie verknüpfe ich Steam?","documents":["Steam mit Discord verbinden.","Ein Turnier anmelden."]}'             | target/release/dl-knowledge hybrid check
      - name: TinyBERT auf 254 Fällen messen
        env:
          DL_KNOWLEDGE_EMBEDDER: fastembed
          DL_KNOWLEDGE_BENCH_DOCS: ${{ github.workspace }}/Deadlock-Docs/public
        run: |
          set -euo pipefail
          evals="${{ github.workspace }}/Deadlock-Docs/evals"
          out="$RUNNER_TEMP/tinybert-sweep"
          mkdir -p "$out"
          variants=(
            'tiny-8-b4|{"rerank":true,"bm25_k":24,"dense_k":16,"fusion_k":8,"output_k":6,"rrf_k":60.0,"bm25_weight":1.04,"dense_weight":1.0,"dense_relevance_filter":true,"rerank_batch_size":4,"timeout_ms":10000}'
            'tiny-8-b8|{"rerank":true,"bm25_k":24,"dense_k":16,"fusion_k":8,"output_k":6,"rrf_k":60.0,"bm25_weight":1.04,"dense_weight":1.0,"dense_relevance_filter":true,"rerank_batch_size":8,"timeout_ms":10000}'
            'tiny-12-b8|{"rerank":true,"bm25_k":24,"dense_k":16,"fusion_k":12,"output_k":6,"rrf_k":60.0,"bm25_weight":1.04,"dense_weight":1.0,"dense_relevance_filter":true,"rerank_batch_size":8,"timeout_ms":10000}'
          )
          for item in "${variants[@]}"; do
            name="${item%%|*}"
            config="${item#*|}"
            report="$out/$name.json"
            echo "::group::$name"
            DL_KNOWLEDGE_HYBRID_OPTIONS="$config"               bash scripts/central_test_db.sh               target/release/dl-knowledge hybrid bench "$evals" "$report" 1
            python3 ../.tasks/2026-09-17-rag-ausbau-visual-brain/session4_sweep_summary.py "$report" reranked
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print("SESSION4_RERANK_LATENCY", json.dumps({"rerank_p50_ms": d["rerank_p50_ms"], "rerank_p95_ms": d["rerank_p95_ms"], "total_p50_ms": d["reranked"]["query_p50_ms"], "total_p95_ms": d["reranked"]["query_p95_ms"]}, sort_keys=True))' "$report"
            echo "::endgroup::"
          done
