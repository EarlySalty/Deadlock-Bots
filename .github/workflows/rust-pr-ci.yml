name: "Rust PR CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadlock-bots-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Workspace check and tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy,rustfmt
      - name: PostgreSQL client for isolated DB readiness
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Full repository Rust gate
        run: rust/scripts/central_ci.sh
