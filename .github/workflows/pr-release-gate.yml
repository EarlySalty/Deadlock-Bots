name: "PR Release Gate"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional pull request number. Empty reconciles all open pull requests."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-release-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: "Auto merge after gates"
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile eligible pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requested = Number.parseInt(process.env.INPUT_PR_NUMBER || "", 10);

            const requiredChecksByRepo = {
              "Deadlock-Twitch-Bot": [
                "Semantic review",
                "Scope-Abgleich (keine toten Projekte)",
                "Frontend PR Gate (website)",
                "Frontend PR Gate (admin_dashboard)",
                "Frontend PR Gate (dashboard_v2)",
                "Uplink Auth, Broker und Dashboard-Anschluss",
                "offline-build",
                "schema-gate",
              ],
              "Deadlock-Bots": [
                "Semantic review",
                "Workspace check and tests",
                "Knowledge eval",
                "Knowledge hybrid",
              ],
              "Deadlock-Steam-Bot": [
                "Semantic review",
                "clippy + test",
              ],
              "uplink": [
                "Semantic review",
                "check",
              ],
              "Deadlock-Brain": [
                "Semantic review",
                "Migration composition",
                "Rust compile",
                "Python syntax",
              ],
              "Deadlock--Patchnotes-Bot": [
                "Semantic review",
                "Python tests",
                "Changed Python and dependency security",
              ],
              "Deadlock-Turniere": [
                "Semantic review",
                "Frontend CI",
                "Rust workspace and isolated PostgreSQL",
                "Secret Detection",
                "JavaScript Dependency Audit",
                "Semgrep SAST",
                "CodeQL Analysis (javascript-typescript)",
                "Trivy Filesystem Scan",
              ],
            };

            const requiredChecks = requiredChecksByRepo[repo];
            if (!requiredChecks) {
              core.setFailed(`No required-check policy exists for repository ${repo}.`);
              return;
            }

            let pulls;
            if (Number.isInteger(requested) && requested > 0) {
              pulls = [(await github.rest.pulls.get({ owner, repo, pull_number: requested })).data];
            } else {
              pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
            }

            const acceptedCheckConclusions = new Set(["success", "neutral", "skipped"]);
            const acceptedStatusStates = new Set(["success"]);

            for (const listed of pulls) {
              const pull_number = listed.number;
              let pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;

              if (pr.base.ref !== "main" || pr.draft) {
                core.notice(`PR #${pull_number}: base is not main or the PR is a draft.`);
                continue;
              }
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.notice(`PR #${pull_number}: automatic merge is limited to same-repository branches.`);
                continue;
              }

              const permissionResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: pr.user.login,
              });
              const trustedPermissions = new Set(["admin", "maintain", "write"]);
              if (!trustedPermissions.has(permissionResponse.data.permission)) {
                core.notice(
                  `PR #${pull_number}: author ${pr.user.login} lacks trusted write permission (${permissionResponse.data.permission}).`,
                );
                continue;
              }

              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });
              const protectedPolicyPath = (filename) =>
                filename.startsWith(".github/") ||
                filename.startsWith("scripts/ci/") ||
                /^rust\/scripts\/(?:central_ci|central_fresh_schema|central_test_db|check)\.sh$/.test(filename);
              const protectedChanges = changedFiles
                .map((file) => file.filename)
                .filter(protectedPolicyPath);
              if (protectedChanges.length) {
                core.notice(
                  `PR #${pull_number}: trusted manual bootstrap required for CI/release-policy files: ${protectedChanges.join(", ")}`,
                );
                continue;
              }

              const evaluatedSha = pr.head.sha;
              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{basehead}",
                {
                  owner,
                  repo,
                  basehead: `${pr.base.sha}...${evaluatedSha}`,
                },
              );

              if ((comparison.data.behind_by || 0) > 0) {
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number,
                    expected_head_sha: evaluatedSha,
                  });
                  core.notice(`PR #${pull_number}: base moved. Branch update requested, all gates must run again.`);
                } catch (error) {
                  core.warning(`PR #${pull_number}: branch update failed: ${String(error?.message || error)}`);
                }
                continue;
              }

              if (pr.mergeable !== true || pr.mergeable_state === "dirty") {
                core.notice(`PR #${pull_number}: mergeability is not clean yet.`);
                continue;
              }

              const checkResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: evaluatedSha,
                filter: "latest",
                per_page: 100,
              });
              const checkRuns = checkResponse.data.check_runs || [];
              const byName = new Map(checkRuns.map((check) => [check.name, check]));

              const missingRequired = requiredChecks.filter((name) => !byName.has(name));
              const incompleteRequired = requiredChecks.filter((name) => {
                const check = byName.get(name);
                return check && (check.status !== "completed" || check.conclusion !== "success");
              });
              if (missingRequired.length || incompleteRequired.length) {
                core.notice(
                  `PR #${pull_number}: required checks not ready. missing=${missingRequired.join(",") || "none"} incomplete=${incompleteRequired.join(",") || "none"}.`,
                );
                continue;
              }

              const pendingChecks = checkRuns.filter((check) => check.status !== "completed");
              const failedChecks = checkRuns.filter(
                (check) =>
                  check.status === "completed" &&
                  !acceptedCheckConclusions.has(check.conclusion || ""),
              );

              const combinedStatus = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: evaluatedSha,
                per_page: 100,
              });
              const statuses = combinedStatus.data.statuses || [];
              const failedStatuses = statuses.filter(
                (status) => !acceptedStatusStates.has(status.state),
              );

              if (pendingChecks.length || failedChecks.length || failedStatuses.length) {
                core.notice(
                  `PR #${pull_number}: gates not fully green. pending=${pendingChecks.length}, failed_checks=${failedChecks.length}, failed_statuses=${failedStatuses.length}.`,
                );
                continue;
              }

              pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.head.sha !== evaluatedSha) {
                core.notice(`PR #${pull_number}: head changed after gate evaluation. Re-evaluation required.`);
                continue;
              }
              if (pr.base.sha !== listed.base.sha && listed.base?.sha) {
                core.notice(`PR #${pull_number}: base changed during reconciliation. Re-evaluation required.`);
                continue;
              }

              try {
                const merged = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: "squash",
                  sha: evaluatedSha,
                });
                if (merged.data.merged) {
                  core.notice(`PR #${pull_number}: merged after fresh base, semantic review, and required CI.`);
                } else {
                  core.warning(`PR #${pull_number}: GitHub did not merge: ${merged.data.message || "unknown reason"}`);
                }
              } catch (error) {
                core.warning(`PR #${pull_number}: merge rejected by GitHub: ${String(error?.message || error)}`);
              }
            }
