name: PR Release Gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to report; never merges or updates branches.
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  report:
    name: Report only - manual release decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Metadata only; no PR checkout or execution under pull_request_target.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REQUESTED_PR: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const requested = Number(process.env.REQUESTED_PR || context.payload.pull_request?.number || 0);
            if (!Number.isSafeInteger(requested) || requested <= 0) {
              await core.summary.addRaw('Report only: no PR selected. No merge, branch update, deployment or release approval.').write();
              return;
            }
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: requested});
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: pr.head.sha, filter: 'latest', per_page: 100,
            });
            const trusted = checks.filter(c => c.head_sha === pr.head.sha && c.app?.slug === 'github-actions');
            const failed = trusted.filter(c => c.status === 'completed' && !['success', 'neutral', 'skipped'].includes(c.conclusion));
            await core.summary.addRaw(`PR #${requested}, head ${pr.head.sha}, draft=${pr.draft}. Current GitHub Actions checks: ${trusted.length}; unsuccessful: ${failed.length}. Report only; missing or skipped checks are not approval. No merge, branch update or deployment.`).write();
