rules:
  - id: rust.tls.certificate-validation-disabled
    languages: [rust]
    severity: ERROR
    message: Never disable TLS certificate validation in a client.
    metadata:
      category: security
      cwe: ['CWE-295: Improper Certificate Validation']
    pattern: $CLIENT.danger_accept_invalid_certs(true)

  - id: rust.tls.hostname-validation-disabled
    languages: [rust]
    severity: ERROR
    message: Never disable TLS hostname validation in a client.
    metadata:
      category: security
      cwe: ['CWE-297: Improper Validation of Certificate with Host Mismatch']
    pattern: $CLIENT.danger_accept_invalid_hostnames(true)

  - id: rust.process.shell-command
    languages: [rust]
    severity: WARNING
    message: Prefer direct process arguments over a shell command string.
    metadata:
      category: security
      cwe: ['CWE-78: OS Command Injection']
    patterns:
      - pattern-either:
          - pattern: Command::new("sh").arg("-c").arg($COMMAND)
          - pattern: Command::new("bash").arg("-c").arg($COMMAND)
          - pattern: std::process::Command::new("sh").arg("-c").arg($COMMAND)
          - pattern: std::process::Command::new("bash").arg("-c").arg($COMMAND)
          - pattern: tokio::process::Command::new("sh").arg("-c").arg($COMMAND)
          - pattern: tokio::process::Command::new("bash").arg("-c").arg($COMMAND)
      # Exact constant wrapper sets a restrictive umask; variable paths follow as
      # separate argv entries through quoted "$@", never interpolated shell input.
      # The end-to-end ffmpeg integration test is mandatory in the PR suite.
      - pattern-not: Command::new("sh").arg("-c").arg("umask 077; exec ffmpeg \"$@\"")

  - id: python.tls.certificate-validation-disabled
    languages: [python]
    severity: ERROR
    message: Never disable TLS certificate validation in requests.
    metadata:
      category: security
      cwe: ['CWE-295: Improper Certificate Validation']
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: python.process.shell-input
    languages: [python]
    severity: WARNING
    message: subprocess shell=True introduces a shell boundary; pass a list without a shell.
    metadata:
      category: security
      cwe: ['CWE-78: OS Command Injection']
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: javascript.dynamic-evaluation
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code evaluation risks executing attacker-controlled input.
    metadata:
      category: security
      cwe: ['CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code']
    pattern-either:
      - pattern: eval($CODE)
      - pattern: new Function(...)
