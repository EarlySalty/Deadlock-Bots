# Discord-Konfiguration für den laufenden Umbau.
# WIP: dl-bot und dl-knowledge verwenden diesen Lader noch nicht.
# Vor Aktivierung müssen die vorhandenen Betriebswerte übernommen werden.
# Zugangsdaten bleiben in Infisical und gehören nicht in diese Datei.
schema_version = 1

[discord]
# guild_id, channels und roles vor dem produktiven Cutover inventarisieren.
# Discord-IDs werden als Dezimalstrings eingetragen.

[services]
master_broker_port = 8770
changelog_port = 8899

[features]
gateway = false
onboarding = false
concierge = false
lfg = false
voice = false

[moderation]
enforce = false

[concierge]
timeout_seconds = 100

[knowledge]
ask_url = "http://127.0.0.1:8896/public/v1/ask"
timeout_seconds = 7
retrieval = "bm25"

[llm.fireworks]
selection = "latest_stable"
family = "deepseek_flash"
refresh_seconds = 3600
fallback_max_age_seconds = 86400
# Ein eingetragenes model deaktiviert die automatische Auswahl.
# Die Katalogabfrage, Probe und Aktualisierung der Clients sind noch anzubinden.

[llm.use_cases.moderation_verify]
provider = "openai"

[llm.use_cases.turnier_vorschlag]
provider = "openai"

[llm.use_cases.voice_hint]
provider = "openai"
