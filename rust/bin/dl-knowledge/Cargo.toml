[package]
name = "dl-knowledge"
description = "Loopback-Wissensdienst mit BM25-Retrieval und Fireworks-Antworten"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
version = "0.1.0"

[features]
default = ["dense-fastembed", "rerank-fastembed"]
rerank-fastembed = ["dep:fastembed"]
dense-fastembed = ["dep:fastembed"]
dense-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
dl-ai.workspace = true
dl-core.workspace = true
dl-central-db.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
pgvector = { version = "0.4", features = ["sqlx"] }
fastembed = { version = "=5.2.0", optional = true, default-features = false, features = ["ort-download-binaries"] }
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
candle-transformers = { version = "=0.9.1", optional = true }
tokenizers = { version = "=0.21.4", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
async-trait.workspace = true
dl-central-db = { workspace = true, features = ["testing"] }
reqwest.workspace = true
tempfile.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
