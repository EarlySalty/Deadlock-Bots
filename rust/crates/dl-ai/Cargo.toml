[package]
name = "dl-ai"
description = "AI-Anbindung: MiniMax-Client (Token-Plan + Standard) für Scoring/Moderation/Chat"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
version = "0.1.0"

[features]
# dl-ai hat keine Testdatenbank; das Merkmal existiert, damit der
# Pflicht-Testbefehl des Repos (`--features testing`) auch fuer dieses Paket
# einzeln laeuft, statt mit "does not contain this feature" abzubrechen.
testing = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
dl-bridges.workspace = true
reqwest.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# test-util: pausierte Uhr fuer die Zeitfenster im Transparenz-Log, damit die
# Tests nicht gegen die echte Uhr laufen.
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true

[lints]
workspace = true
