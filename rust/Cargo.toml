# Rust-Rewrite der Deadlock-Bots (Strangler-Fig neben dem Python-Original).
# Architektur: 2 Binaries (dl-bot, dl-web) + Domain-Library-Crates.
# Plan und Verträge: siehe rust/docs/00-rewrite-plan.md
[workspace]
resolver = "2"
members = [
    "crates/dl-core",
    "crates/dl-webcore",
    "crates/dl-stats",
    "crates/dl-tierlist",
    "crates/dl-broker",
    "crates/dl-changelog",
    "crates/dl-discord",
    "crates/dl-bridges",
    "crates/dl-voice",
    "crates/dl-activity",
    "crates/dl-ai",
    "crates/dl-brain",
    "crates/dl-moderation",
    "crates/dl-squads",
    "crates/dl-community",
    "crates/dl-dashboard",
    "crates/dl-central-db",
    "crates/dl-central-etl",
    "crates/dl-server-as-code",
    "bin/dl-bot",
    "bin/dl-web",
    "bin/dl-twitch-invite-sync",
    "bin/dl-repostats",
    "bin/dl-central-migrate",
    "bin/dl-central-sync",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/NaniDerEchte2/Deadlock-Bots"

# Eine gepinnte Version pro Dependency — einzige Quelle der Wahrheit für den
# gesamten Workspace. Crates übernehmen via `<dep>.workspace = true`.
[workspace.dependencies]
# Async-Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
# Fehler-Typen (Domänen) / Fehler-Kontext (Binaries)
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# SQLite — nur noch dl-central-etl liest Quell-SQLite-Snapshots.
rusqlite = { version = "0.32", features = ["bundled"] }
# Postgres — zentrale DB, Migrationen und compile-checked Queries.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono"] }
# HTTP-Server (dl-web; Broker folgt in Phase 2)
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
# HTTP-Client (Dashboard-Relay, deadlock-api.com)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
# Zeit (ISO-Strings kompatibel zu Python datetime.isoformat)
chrono = "0.4"
chrono-tz = "0.10"
# Session-Signierung (HMAC-SHA256, Vertrag mit public_stats.py)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# Broker: dyn-fähige async Traits + Request-IDs
async-trait = "0.1"
# Discord (Gateway erst beim Cutover aktiv; REST sofort nutzbar)
serenity = { version = "0.12", default-features = false, features = ["client", "http", "gateway", "rustls_backend", "model", "cache", "utils"] }
rand = "0.8"
# Namens-Normalisierung (streamer_link_matcher: NFKD-Deaccent)
unicode-normalization = "0.1"
# URL-Parsing (Dashboard-Redirect-Validierung, Sicherheits-Check)
url = "2"

# Tests
tempfile = "3"

# Interne Crates
dl-core = { path = "crates/dl-core" }
dl-webcore = { path = "crates/dl-webcore" }
dl-stats = { path = "crates/dl-stats" }
dl-tierlist = { path = "crates/dl-tierlist" }
dl-broker = { path = "crates/dl-broker" }
dl-changelog = { path = "crates/dl-changelog" }
dl-discord = { path = "crates/dl-discord" }
dl-bridges = { path = "crates/dl-bridges" }
dl-voice = { path = "crates/dl-voice" }
dl-activity = { path = "crates/dl-activity" }
dl-ai = { path = "crates/dl-ai" }
dl-brain = { path = "crates/dl-brain" }
dl-moderation = { path = "crates/dl-moderation" }
dl-squads = { path = "crates/dl-squads" }
dl-community = { path = "crates/dl-community" }
dl-dashboard = { path = "crates/dl-dashboard" }
dl-central-db = { path = "crates/dl-central-db" }
dl-central-etl = { path = "crates/dl-central-etl" }
dl-server-as-code = { path = "crates/dl-server-as-code" }

[workspace.lints.clippy]
unwrap_used = "warn"
