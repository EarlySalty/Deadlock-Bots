# Policy and exceptions: ../.github/SECURITY-CI.md
[graph]
all-features = true

[advisories]
version = 2
# No vulnerability exceptions. Scanner and database failures are blocking.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
  "CC0-1.0", "Unlicense", "MPL-2.0", "BSL-1.0", "OpenSSL", "NCSA", "CDLA-Permissive-2.0",
]

[bans]
# Multiple semver lines are normal in this 32-member workspace, not an advisory.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
