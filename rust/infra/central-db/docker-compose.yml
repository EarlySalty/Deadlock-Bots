services:
  deadlock-central-postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: deadlock-central-postgres
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: deadlock
      POSTGRES_USER: deadlock
      # POSTGRES_PASSWORD muss via up.sh/Infisical in der Env stehen — sonst bricht der Start ab.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      - deadlock_central_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  deadlock_central_pgdata:
